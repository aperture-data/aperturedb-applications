name: Publish docs content
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-content-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a release version in MAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          echo "tag=${version}" >> "$GITHUB_OUTPUT"
      - name: Create release tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            tagged_commit=$(git rev-parse "refs/tags/${RELEASE_VERSION}^{commit}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag ${RELEASE_VERSION} already points to another commit; bump VERSION." >&2
              exit 1
            fi
          else
            git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          username: ${{ fromJson(secrets.DOCKERHUB).username }}
          password: ${{ fromJson(secrets.DOCKERHUB).password }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docs-content/Dockerfile
          build-args: SOURCE_REVISION=${{ steps.version.outputs.tag }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: aperturedata/aperturedb-applications-docs:${{ steps.version.outputs.tag }}
      - name: Update infra component
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PAT_INFRA }}
          DEPLOY_ENV: develop
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq -n --arg tag "$IMAGE_TAG" --arg environment "$DEPLOY_ENV" \
            '{event_type:"update-tag",client_payload:{environment:$environment,component:"applications",tag:$tag}}' \
            | gh api repos/aperture-data/infra/dispatches --input -
