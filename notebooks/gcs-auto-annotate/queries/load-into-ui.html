<!doctype html>
<html><head><meta charset="utf-8"><title>Load the Demo Queries into the ApertureDB UI</title>
<style>body{font:16px sans-serif;max-width:640px;margin:60px auto;line-height:1.5}code{background:#eee;padding:1px 5px}</style>
</head><body>
<h2>Demo Queries for the ApertureDB UI</h2>
<p id="msg">Loading...</p>
<script>
const QUERIES = [{"name": "01 Team Sports Movies", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "regex", "(?i)(sport|football|basketball|baseball|soccer|hockey|tennis|boxing|wrestl|athlete|rugby|swimming)"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": true, "constraints": ["all", ["$face_count", ">=", 3], ["$adult_content_rank", "<=", 2], ["$violent_content_rank", "<=", 2]], "results": {"list": ["gcs_object_name", "face_count", "adult_content_likelihood", "violent_content_likelihood"], "limit": 12}, "sort": {"key": "face_count", "order": "descending"}}}]}, {"name": "02 Family Movie Night", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "animation"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": true, "constraints": ["all", ["$adult_content_rank", "<=", 1], ["$violent_content_rank", "<=", 1], ["$face_count", ">=", 1], ["$min_face_joy", ">=", 0.6]], "results": {"list": ["gcs_object_name", "face_count", "min_face_joy", "adult_content_likelihood", "violent_content_likelihood"], "limit": 12}, "sort": {"key": "face_count", "order": "descending"}}}]}, {"name": "03 Everyone Looks Happy", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "fictional character"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": true, "constraints": ["all", ["$face_count", ">=", 1], ["$min_face_joy", ">=", 0.7]], "results": {"list": ["gcs_object_name", "face_count", "min_face_joy", "label_count"], "limit": 12}, "sort": {"key": "face_count", "order": "descending"}}}]}, {"name": "04 Label Vocabulary", "query": [{"FindEntity": {"with_class": "GCSLabel", "constraints": ["all", ["$score", ">=", 0.5]], "results": {"group": ["description"], "count": true, "avg": "score"}}}]}, {"name": "05 Safety Ratings", "query": [{"FindImage": {"blobs": false, "results": {"group": ["adult_content_likelihood", "violent_content_likelihood"], "count": true}}}]}, {"name": "06 Family Friendly", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "animation"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": true, "constraints": ["all", ["$adult_content_rank", "<=", 1], ["$violent_content_rank", "<=", 1]], "results": {"list": ["gcs_object_name", "adult_content_likelihood", "violent_content_likelihood"], "limit": 12}}}]}, {"name": "07 Labels Containing", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "action"], ["$score", ">=", 0.6]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": true, "results": {"list": ["gcs_object_name", "label_count", "face_count"], "limit": 12}}}]}, {"name": "08 People by Name", "query": [{"FindBoundingBox": {"_ref": 1, "constraints": ["all", ["$object_name", "regex", "(?i)^(man|woman|girl|boy)$"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": false, "results": {"list": ["gcs_object_name", "object_count", "face_count"], "limit": 12}}}]}, {"name": "09 Label Search Boolean", "query": [{"FindEntity": {"with_class": "GCSLabel", "constraints": ["all", ["any", ["$description", "icontains", "action"], ["$description", "icontains", "fiction"]], ["not", ["$description", "icontains", "game"]], ["$score", ">=", 0.6]], "results": {"list": ["description", "score", "image_id"], "limit": 25}, "sort": {"key": "score", "order": "descending"}}}]}, {"name": "10 Label Shapes", "query": [{"FindEntity": {"with_class": "GCSLabel", "constraints": ["all", ["any", ["$description", "like", "%ing"], ["$description", "istarts_with", "for "]]], "results": {"list": ["description", "score"], "limit": 25}, "sort": {"key": "score", "order": "descending"}}}]}, {"name": "11 Label Word Search", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", [{"fulltext": ["$description", "animatd film", "any", 1]}, ">", 0], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"ref": 1}, "blobs": false, "results": {"list": ["gcs_object_name", "label_count", "face_count"], "limit": 12}}}]}, {"name": "12 File Name Search", "query": [{"FindImage": {"constraints": ["all", ["$gcs_object_name", "starts_with", "tmdb/posters/10"]], "blobs": false, "results": {"list": ["gcs_object_name", "width", "height"], "limit": 20}}}]}, {"name": "13 Happy Frontal Faces", "query": [{"FindBoundingBox": {"with_label": "face", "constraints": ["all", ["$joy", ">", "$sorrow"], ["$joy", ">", "$anger"], [{"abs": "$pan_angle"}, "<", 20], ["$area_fraction", ">=", 0.01]], "blobs": false, "results": {"list": ["image_id", "joy", "pan_angle", "area_fraction"], "limit": 8}, "sort": {"key": "joy", "order": "descending"}}}]}, {"name": "14 Delighted Faces", "query": [{"FindBoundingBox": {"with_label": "face", "constraints": ["all", [{"add": ["$joy", "$surprise"]}, ">", 0.85], ["$sorrow", "<", 0.1]], "results": {"list": ["image_id", "joy", "surprise", "sorrow"], "limit": 8}, "sort": {"key": "joy", "order": "descending"}}}]}, {"name": "15 Dominant Faces", "query": [{"FindBoundingBox": {"with_label": "face", "constraints": ["all", ["$area_fraction", ">=", 0.08], ["$detection_confidence", ">=", 0.9]], "blobs": false, "results": {"list": ["image_id", "area_fraction", "detection_confidence"], "limit": 8}, "sort": {"key": "area_fraction", "order": "descending"}}}]}, {"name": "16 Sensitive Content", "query": [{"FindImage": {"constraints": ["all", ["any", ["$adult_content_rank", ">=", 3], ["$violent_content_rank", ">=", 3]]], "blobs": false, "results": {"list": ["gcs_object_name", "adult_content_likelihood", "violent_content_likelihood"], "limit": 12}}}]}, {"name": "17 Not yet Enriched", "query": [{"FindImage": {"constraints": ["all", ["$face_count", "is_missing"]], "blobs": false, "results": {"count": true}}}]}, {"name": "18 Happy Faces on Tagged Posters", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "film"]]}}, {"FindImage": {"_ref": 2, "is_connected_to": {"ref": 1}, "blobs": false, "results": {"list": ["gcs_object_name"], "limit": 12}}}, {"FindBoundingBox": {"image_ref": 2, "with_label": "face", "constraints": ["$joy", ">=", 0.3], "results": {"list": ["image_id", "joy", "area_fraction"], "limit": 12}, "sort": {"key": "joy", "order": "descending"}}}]}, {"name": "19 Label and Object Together", "query": [{"FindEntity": {"_ref": 1, "with_class": "GCSLabel", "constraints": ["all", ["$description", "icontains", "clothing"]]}}, {"FindBoundingBox": {"_ref": 2, "constraints": ["all", ["$object_name", "icontains", "person"], ["$score", ">=", 0.5]]}}, {"FindImage": {"is_connected_to": {"all": [{"ref": 1}, {"ref": 2}]}, "blobs": false, "results": {"list": ["gcs_object_name", "face_count", "object_count"], "limit": 12}}}]}, {"name": "20 Objects Between", "query": [{"FindImage": {"_ref": 1, "blobs": false}}, {"FindBoundingBox": {"is_connected_to": {"ref": 1, "connection_class": "HasDetection", "constraints": {"detector": ["==", "object"], "score": [">=", 0.3, "<", 0.5]}}, "results": {"list": ["object_name", "score", "image_id"], "limit": 12}, "sort": {"key": "score", "order": "descending"}}}]}, {"name": "21 Crowded Posters", "query": [{"FindImage": {"constraints": ["all", ["$face_count", ">=", 3], ["$object_count", ">=", 5]], "blobs": false, "results": {"list": ["gcs_object_name", "face_count", "object_count"], "limit": 12}, "sort": {"key": "face_count", "order": "descending"}}}]}, {"name": "22 Poster Neighbourhood", "query": [{"FindImage": {"_ref": 1, "blobs": false, "constraints": ["all", ["$gcs_object_stem", "==", "9614"]], "results": {"all_properties": true}}}, {"FindEntity": {"with_class": "GCSLabel", "is_connected_to": {"ref": 1}, "results": {"list": ["description", "score"], "limit": 8}, "sort": {"key": "score", "order": "descending"}}}, {"FindBoundingBox": {"image_ref": 1, "coordinates": true, "results": {"list": ["_label", "score", "joy"]}}}]}, {"name": "23 Why Flagged", "query": [{"FindImage": {"_ref": 1, "blobs": false, "constraints": ["all", ["any", ["$adult_content_rank", ">=", 3], ["$violent_content_rank", ">=", 3]]], "results": {"list": ["gcs_object_name"], "limit": 5}}}, {"FindEntity": {"with_class": "GCSLabel", "is_connected_to": {"ref": 1}, "constraints": ["$score", ">=", 0.8], "results": {"list": ["description", "score", "image_id"], "limit": 30}, "sort": {"key": "score", "order": "descending"}}}]}, {"name": "24 Overlap Candidates", "query": [{"FindBoundingBox": {"_ref": 1, "with_label": "Logo", "constraints": ["all", ["$score", ">=", 0.5]]}}, {"FindBoundingBox": {"_ref": 2, "with_label": "face"}}, {"FindImage": {"is_connected_to": {"all": [{"ref": 1}, {"ref": 2}]}, "blobs": false, "results": {"list": ["id", "gcs_object_name"], "limit": 500}}}]}];
// The UI keeps its saved custom queries in this browser's localStorage, so this page must be opened from the
// UI's own address (it is served at /load-queries.html next to the UI).
const KEY = 'savedQueryCustoms';
const msg = document.getElementById('msg');
try {
  const user = localStorage.getItem('username') || 'admin';
  const names = new Set(QUERIES.map((q) => q.name.toLowerCase()));
  const kept = JSON.parse(localStorage.getItem(KEY) || '[]').filter((e) => !(e.userName === user && names.has(String(e.name).toLowerCase())));
  const now = new Date().toISOString();
  const added = QUERIES.map((q) => ({id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),
    userName: user, name: q.name, date: now, query: JSON.stringify(q.query, null, 2), isModified: false, isSelected: false}));
  localStorage.setItem(KEY, JSON.stringify(kept.concat(added)));
  const loggedIn = !!localStorage.getItem('token');
  msg.innerHTML = 'Added <b>' + added.length + '</b> queries for user <code>' + user + '</code>. ' +
    (loggedIn ? 'Opening <a href="/custom-query">Custom Query</a> ... they are listed under <b>Queries</b> on the left.'
              : 'Opening the <a href="/login">login page</a> ... after logging in, open <b>Custom Query</b>: they are listed under <b>Queries</b> on the left.');
  setTimeout(() => { location.href = loggedIn ? '/custom-query' : '/login'; }, 1800);
} catch (e) {
  msg.textContent = 'Could not store the queries: ' + e;
}
</script></body></html>
